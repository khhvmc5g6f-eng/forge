name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: dart analyze

      - name: Dart/Flutter test suite
        run: flutter test

      - name: Web-lab engine tests (Node)
        run: node --test web_lab/test/engine.test.mjs
